<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }
    .spinner {
      border: 3px solid #e0e0e0;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxgraDNYExsp8h8Ybd2ISY0BfF58-5dbjnS9QlxIAifZo8Ihr-RIOhM9nrqOYUkY0k/exec"; 

    async function handleRedirect() {
      const statusEl = document.getElementById("status");
      const loaderEl = document.getElementById("loader");

      const urlParams = new URLSearchParams(window.location.search);
      
      // 1. First check explicit param
      let key = urlParams.get("slug");

      // 2. Fallback to standalone key-only param (e.g., ?github)
      if (!key) {
        key = Array.from(urlParams.keys())[0];
      }

      if (key) {
        key = key.trim();
      }

      if (!key) {
        loaderEl.style.display = "none";
        statusEl.textContent = "No query parameter provided.";
        return;
      }

      try {
        const response = await fetch(GAS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key: key })
        });

        const data = await response.json();

        if (data.status === "success" && data.target) {
          window.location.href = data.target;
        } else {
          loaderEl.style.display = "none";
          statusEl.textContent = "Link not found.";
        }
      } catch (err) {
        loaderEl.style.display = "none";
        statusEl.textContent = "Error resolving link.";
      }
    }

    handleRedirect();
  </script>
</body>
</html>
